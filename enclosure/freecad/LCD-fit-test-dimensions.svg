<text x="565" y="525" font-size="14">Retainer nose OD 38.4 / ID 36.4.</text>
<text x="565" y="550" font-size="14">Thread-forming M2 screw/pilot assumptions REQUIRE fit testing.</text>
<text x="565" y="575" font-size="14">Do not force screws or bend the PCB. Front surface has no screws.</text>
